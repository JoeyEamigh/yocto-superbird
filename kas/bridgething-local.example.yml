header:
  version: 18
  includes:
    - repo: yocto-superbird
      file: kas/bridgething.yml

local_conf_header:
  externalsrc: |
    BRIDGETHING_LOCAL = "/path/to/your/bridgething"

    BRIDGETHING_DAEMON_PROVISION = "source"
    BRIDGETHING_WEBAPPS_PROVISION = "source"

    INHERIT += "externalsrc"

    EXTERNALSRC:pn-bridgething-daemon = "${BRIDGETHING_LOCAL}"
    EXTERNALSRC_BUILD:pn-bridgething-daemon = "${WORKDIR}/build"

    EXTERNALSRC:pn-bridgething-webapps = "${BRIDGETHING_LOCAL}"
    EXTERNALSRC_BUILD:pn-bridgething-webapps = "${WORKDIR}/build"


    SRC_URI:remove:pn-bridgething-daemon = "gitsm://github.com/JoeyEamigh/bridgething.git;protocol=https;branch=main;destsuffix=${BP}"
    SRC_URI:remove:pn-bridgething-webapps = "git://github.com/JoeyEamigh/bridgething.git;protocol=https;branch=main;destsuffix=${BP}"
    SRCREV:pn-bridgething-daemon = "INVALID"
    SRCREV:pn-bridgething-webapps = "INVALID"

    EXTERNALSRC_SYMLINKS = ""

    CARGO_BUILD_FLAGS:append:pn-bridgething-daemon = " --config profile.release.lto=false --config profile.release.codegen-units=32"

  hashserv-reporter: |
    # BB_HASHSERVE = "wss://hashserv.bridgething.com/ws"
    # BB_HASHSERVE_USERNAME = "your-user"
    # BB_HASHSERVE_PASSWORD = "your-token"

repos:
  yocto-superbird:
    path: .
    layers:
      meta-superbird:
      meta-bridgething:
